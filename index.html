<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Text Clock</title>
    <link rel="stylesheet" href="styles.css">
</head>

<body>
    <div class="clock-container">
        <div class="text-content">
            <p><span class="it">it</span> <span class="is">is</span> <span class="half">half</span> <span class="ten">ten</span></p>
            <p><span class="quarter">quarter</span> <span class="twenty">twenty</span></p>
            <p><span class="five">five</span> <span class="minutes">minutes</span> <span class="to">to</span></p>
            <p><span class="past">past</span> <span class="two">two</span> <span class="three">three</span></p>
            <p><span class="one">one</span> <span class="four">four</span> <span class="five-hour">five</span></p>
            <p><span class="six">six</span> <span class="seven">seven</span> <span class="eight">eight</span></p>
            <p><span class="nine">nine</span> <span class="ten-hour">ten</span> <span class="eleven">eleven</span></p>
            <p><span class="twelve">twelve</span> <span class="oclock">o'clock</span></p>
        </div>
        <div class="minute-dots">
            <span class="dot"></span>
            <span class="dot"></span>
            <span class="dot"></span>
            <span class="dot"></span>
        </div>
    </div>
    <script src="script.js"></script>
</body>

</html>
